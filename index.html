/* Responsive navigation refresh · Ahmed Life Lab · October 2026 */
.nav button{display:flex;align-items:center;gap:10px}
.nav .nav-icon{flex:0 0 22px;display:inline-flex;justify-content:center;align-items:center;font-size:17px;line-height:1}
.nav .nav-label{min-width:0;line-height:1.2}
@media(max-width:900px){
  aside{padding:14px 14px 12px}
  header.logo{margin:0 0 12px!important;font-size:26px}
  .nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;overflow:visible;width:100%}
  .nav button{display:flex;align-items:center;gap:7px;min-width:0;min-height:40px;padding:8px 9px;border:1px solid #e0e5db;border-radius:10px;background:#f9faf6;color:#506557;white-space:normal;text-align:left;font-size:12px;font-weight:630;line-height:1.15}
  .nav button.active{background:#dce5d9;border-color:#cadacc;color:#284b39}

  main{padding:14px 14px 24px}
  .top{align-items:center;gap:6px;margin-bottom:10px}
  .top .eyebrow{font-size:10px;letter-spacing:1.2px}
  .top .chip{font-size:11px;padding:7px 9px}
  h1{margin:8px 0 12px;font-size:clamp(29px,7vw,39px);line-height:1.15}

.idea-launcher{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;margin-top:14px;padding:15px 18px;color:#263a31;font:inherit;border-radius:15px}
.idea-launcher:hover,.idea-launcher:focus-visible{background:#fbfcf9;border-color:#bccfbd;outline-offset:2px}
.idea-launcher-icon{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:11px;background:#edf2e9;font-size:20px}
.idea-launcher-label{display:flex;flex-direction:column;gap:5px;min-width:0}
.idea-launcher-label strong{font-size:16px;font-weight:730;color:#263a31}
.idea-launcher-label small{font-size:12px;color:#7b8b7b}
.idea-launcher-arrow{margin-left:auto;color:#698473;font-size:23px}
@media(max-width:900px){.idea-launcher{padding:12px 14px;margin-top:12px}}

/* Ahmed personal calendar */
.ahc{max-width:1350px;margin:0 auto 25px;color:#2a4535}
.ahc button,.ahc select{font:inherit;cursor:pointer}
.ahc-header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.ahc-kicker{font-size:10px;font-weight:750;color:#799080;letter-spacing:1.7px}
.ahc-header h1{font-size:clamp(28px,3vw,39px);margin:7px 0 4px}
.ahc-header p{margin:0;font-size:13px}
.ahc-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.ahc-btn,.ahc-select{min-height:35px;padding:8px 11px;border:1px solid #bccdbb;border-radius:9px;background:#fff;color:#2d4b3a;font-weight:620;font-size:12px}
.ahc-btn.active{background:#214d39;color:#fff;border-color:#214d39}
.ahc-controls{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin:13px 0 7px}
.ahc-fields,.ahc-pager,.ahc-views{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ahc-select{font-weight:500;padding:8px;max-width:150px}
.ahc-pager .arrow{font-size:18px;min-width:36px}
.ahc-caption{margin:13px 0 6px;font-size:19px;font-weight:750;letter-spacing:-.3px}
.ahc-yearbar{display:flex;align-items:center;gap:10px}
.ahc-legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 5px}
.ahc-pri{font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid currentColor}
.ahc-pri.urgent{background:#fdf0f1;color:#a92d38}
.ahc-pri.high{background:#fff3e9;color:#a45b32}
.ahc-pri.normal{background:#edf4ed;color:#42724d}
.ahc-pri.low{background:#ebf3fb;color:#3c6f97}
.ahc-pri.picked{outline:2px solid currentColor;outline-offset:1px}
.ahc-hint{font-size:11px;color:#78897d;margin:5px 0 11px}
.ahc-month{border:1px solid #c2d0bf;border-radius:12px;overflow:hidden;background:#fff}
.ahc-week-head,.ahc-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.ahc-week-head{background:#e5ede1}
.ahc-week-head span{text-align:center;font-weight:730;font-size:12px;padding:10px 2px}
.ahc-cell{min-width:0;min-height:103px;padding:4px 5px;border-top:1px solid #cad8c6;border-right:1px solid #cad8c6}
.ahc-cell:nth-child(7n){border-right:0}
.ahc-cell.outside{background:#f4f6f3}
.ahc-cell.selected{background:#f1f7ef;box-shadow:inset 0 0 0 2px #739575}
.ahc-number-line{display:flex;justify-content:flex-end;margin-bottom:4px}
.ahc-number{border:0;border-radius:25px;background:transparent;color:#2d4b3a;font-size:12px;font-weight:750;min-width:27px;min-height:27px}
.ahc-cell.today .ahc-number{background:#214d39;color:#fff}
.ahc-cell.outside .ahc-number{color:#99a89b}
.ahc-chips{display:grid;gap:3px}
.ahc-chip{display:block;min-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;border-left:3px solid #56805a;border-radius:5px;padding:4px 5px;background:#ebf3e9;color:#355a39;font-size:10px;line-height:1.4}
.ahc-chip.urgent{background:#fef0f1;border-color:#ba3441;color:#aa3540}
.ahc-chip.high{background:#fff0e6;border-color:#bd794d;color:#985b38}
.ahc-chip.low,.ahc-chip.university{background:#eaf2fa;border-color:#4578a5;color:#35628b}
.ahc-chip.done{text-decoration:line-through;opacity:.65}
.ahc-more{font-size:10px;color:#6f806f}
.ahc-agenda{border:1px solid #e0e7dc;border-radius:12px;background:#fff;padding:14px;margin:16px 0}
.ahc-agenda-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ahc-agenda-head h2{font-size:17px;margin:0}
.ahc-agenda-list{display:grid;gap:7px}
.ahc-entry{display:flex;gap:9px;align-items:center;justify-content:space-between;border-left:4px solid #557f5d;background:#f4f7f2;padding:10px 11px;border-radius:7px;min-width:0}
.ahc-entry.urgent{background:#fef2f2;border-color:#b73442}
.ahc-entry.high{background:#fff4ed;border-color:#b8794c}
.ahc-entry.low,.ahc-entry.university{background:#eef5fc;border-color:#5380a4}
.ahc-entry.done{opacity:.65}
.ahc-entry.done strong{text-decoration:line-through}
.ahc-details{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ahc-details strong{font-size:12px;overflow-wrap:anywhere}
.ahc-details small{font-size:11px;color:#718273;white-space:pre-wrap;overflow-wrap:anywhere}
.ahc-entry-tools{display:flex;gap:6px;align-items:center}
.ahc-entry-tools button{border:1px solid #c4d3c1;background:#fff;color:#365942;border-radius:7px;padding:6px 9px;font-size:11px}
.ahc-entry-tools input{accent-color:#356542;width:16px;height:16px}
.ahc-empty{color:#819181;font-size:12px;padding:12px}
.ahc-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #c5d3c2;border-radius:12px;overflow:hidden;background:#fff}
.ahc-week-col{padding:8px;min-width:0;min-height:170px;border-right:1px solid #cbd8c9}
.ahc-week-col:last-child{border-right:0}
.ahc-week-col.selected{background:#f0f6ed}
.ahc-week-col>button{border:0;background:transparent;font-size:12px;font-weight:740;color:#305341;margin-bottom:12px}
.ahc-week-col .ahc-chip{margin-bottom:5px}
.ahc-year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ahc-mini{border:1px solid #d7e1d4;border-radius:12px;background:#fff;padding:11px;min-width:0}
.ahc-mini-title{border:0;background:transparent;color:#2c533b;font-size:13px;font-weight:760;margin-bottom:8px}
.ahc-mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.ahc-mini-grid span,.ahc-mini-grid button{border:0;background:transparent;text-align:center;border-radius:4px;padding:4px 0;font-size:10px;min-width:0;color:#496c50}
.ahc-mini-grid button.has{background:#dcebd7;font-weight:750}
.ahc-mini-grid button.today{background:#264b38;color:white}
.ahc-footnote{margin-top:12px;background:#fff9e9;border:1px solid #f1e4c0;border-radius:9px;padding:10px 12px;font-size:11px;color:#826d49}
.ahc-overlay{position:fixed;inset:0;background:#13271bbb;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.ahc-overlay.show{display:flex}
.ahc-dialog{background:white;border-radius:16px;max-height:90dvh;overflow:auto;width:min(520px,100%);padding:20px}
.ahc-dialog h2{margin:0 0 12px}
.ahc-dialog label{font-size:12px;font-weight:700;display:block;margin:10px 0 5px}
.ahc-dialog input:not([type=checkbox]),.ahc-dialog textarea,.ahc-dialog select{width:100%;min-width:0;border:1px solid #c5d4c2;border-radius:8px;padding:10px;font:inherit;font-size:13px;box-sizing:border-box;background:white;color:#2a4635}
.ahc-dialog textarea{min-height:95px}
.ahc-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px}
.ahc-modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}
@media(max-width:900px){.ahc-cell{min-height:85px}.ahc-controls{justify-content:flex-start}.ahc-header{align-items:flex-start}}
@media(max-width:650px){
 .ahc-header h1{font-size:28px}.ahc-tools .ahc-btn{padding:8px;font-size:11px}
 .ahc-controls .ahc-fields{flex:1 1 100%}.ahc-cell{min-height:55px;padding:2px 1px}
 .ahc-week-head span{font-size:10px;padding:8px 1px}
 .ahc-number-line{justify-content:center}.ahc-number{min-height:23px;min-width:23px;font-size:11px;padding:0}
 .ahc-chips{text-align:center;display:block;line-height:8px}
 .ahc-chip{display:inline-block;vertical-align:middle;width:6px;height:6px;margin:1px;padding:0;border:0;border-radius:50%;font-size:0}
 .ahc-more{font-size:9px}.ahc-week-col{padding:4px 1px;min-height:90px}
 .ahc-week-col>button{padding:0;font-size:10px}.ahc-week-col .ahc-chip{display:block;margin:3px auto}
 .ahc-year{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ahc-mini{padding:7px 5px}.ahc-mini-grid span,.ahc-mini-grid button{font-size:9px;padding:3px 0}
 .ahc-agenda{padding:11px}.ahc-agenda-head h2{font-size:15px}.ahc-form-grid{gap:3px 7px}
}
@media print{
  body{background:#fff!important}aside,.top,main>.notice,.ahc-tools,.ahc-controls,.ahc-yearbar,.ahc-legend,.ahc-hint,.ahc-footnote,.ahc-overlay,.ahc-agenda-head button,.ahc-entry-tools{display:none!important}
  main{max-width:none!important;margin:0!important;padding:0!important}.ahc{max-width:100%}
  .ahc-cell{min-height:84px!important;break-inside:avoid}.ahc-year{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ahc-week-head,.ahc-month-grid,.ahc-mini{break-inside:avoid}.ahc-chip{white-space:normal}
}

/* Ahmed Life Lab daily workspace */
.ahd{max-width:1420px}
.ahd-greeting{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:4px 0 15px;flex-wrap:wrap}
.ahd-greeting .ahd-kicker{font-size:10px;color:#788b7c;letter-spacing:1.4px;font-weight:770;text-transform:uppercase}
.ahd-greeting h1{margin:8px 0 5px;font-size:clamp(29px,3.7vw,42px);letter-spacing:-1.5px;line-height:1.13}
.ahd-greeting p{margin:0;font-size:13px;color:#748377}
.ahd-date-pill{border:1px solid #ccd9ca;border-radius:30px;padding:10px 15px;background:#eef2e9;color:#325840;font-size:12px;font-weight:750;cursor:pointer}
.ahd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 18px}
.ahd-stats>div{border:1px solid #e1e8dd;border-radius:12px;padding:11px 14px;background:#fff;display:flex;gap:10px;align-items:center;min-width:0}
.ahd-stats strong{font-size:24px;font-weight:790;color:#2f513d}
.ahd-stats span{font-size:11px;color:#758578;font-weight:620}
.ahd-layout{display:grid;grid-template-columns:minmax(0,1fr) 188px;align-items:start;gap:16px}
.ahd-work,.ahd-panel,.ahd-columns{min-width:0}
.ahd-columns{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:13px;align-items:start}
.ahd-panel{background:#fff;border:1px solid #e0e7dd;border-radius:15px;padding:14px}
.ahd-panel-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:49px}
.ahd-eyebrow{font-size:9px;letter-spacing:1.4px;font-weight:800;color:#819485}
.ahd-panel h2{margin:5px 0;color:#2c4e39;font-size:19px;letter-spacing:-.35px}
.ahd-solid-btn{border:0;border-radius:9px;background:#214e39;color:#fff;padding:9px 12px;font-size:12px;font-weight:720;cursor:pointer;white-space:nowrap}
.ahd-note-add{background:#557b63}
.ahd-panel-controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-height:43px;margin:2px 0 10px;color:#829082;font-size:11px}
.ahd-panel-controls label{font-weight:730;color:#536858}
.ahd-panel-controls select{font:inherit;font-size:12px;color:#34513e;border:1px solid #cad7c6;background:#fff;border-radius:8px;padding:7px 8px;min-width:98px}
.ahd-filter{margin-left:auto;border:1px solid #d4dfd0;background:#f5f8f3;border-radius:8px;color:#567460;padding:7px 9px;font-size:11px;font-weight:710;cursor:pointer}
.ahd-filter.on{color:#fff;background:#416b50}
.ahd-task-list,.ahd-note-list{display:grid;gap:8px}
.ahd-task{border:1px solid #d2dfd0;background:#f4f8f2;border-radius:11px;padding:11px}
.ahd-task.urgent{border-color:#e5a3a4;background:#fff4f3}
.ahd-task.high{border-color:#e3bb9c;background:#fff7f0}
.ahd-task.low{border-color:#aec9de;background:#f4f9fd}
.ahd-task.is-done{opacity:.72}
.ahd-card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ahd-card-heading strong{font-size:13px;line-height:1.45;color:#2b4535;overflow-wrap:anywhere}
.ahd-task.is-done strong{text-decoration:line-through}
.ahd-task-tag{background:#e8eee5;border-radius:6px;color:#617966;font-size:10px;padding:4px 6px;flex-shrink:0}
.ahd-description{margin:6px 0;color:#58695e;font-size:11px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ahd-task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:9px 0 5px;color:#687b6c;font-size:11px}
.ahd-priority{border:1px solid currentColor;border-radius:6px;padding:2px 5px;color:#46724c;background:#e5f0e4}
.ahd-priority.urgent{color:#b42b3b;background:#fbe9ec}
.ahd-priority.high{color:#9b5d30;background:#fff0e6}
.ahd-priority.low{color:#326c97;background:#e9f2fa}
.ahd-overdue{color:#b12935;font-weight:750}
.ahd-due-today{font-weight:750;color:#aa6a38}
.ahd-task-actions,.ahd-note-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.ahd-small-btn{background:#fff;border:1px solid #cad7c7;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;color:#36543e;cursor:pointer}
.ahd-small-btn.ahd-done{background:#e6eee4}
.ahd-note-card{background:#f6f9f5;border:1px solid #bdcfbc;border-radius:11px;padding:12px}
.ahd-note-card .ahd-card-heading strong{font-size:13px}

<script>(function installAhmedDashboard(){
  "use strict";
  const oldRender=render;
  const NOTE_KEY="ahmed-daily-notes-v1";
  const TIMEZONE="Asia/Dubai";
  let showCompleted=false, allTasks=false, noteArchive=false, ordering="priority",editingNoteId=null;
  const modulesForShortcuts=[["university","🎓","University"],["writing","✍️","Writing Studio"],["life","📅","Calendar"],["sports","🏃","Sports"],["car","🚙","Car Planner"],["coding","⌘","Coding Lab"],["projects","💡","Ahmed's Projects"]];
  function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function todayDubai(){
    const parts=new Intl.DateTimeFormat("en-US",{timeZone:TIMEZONE,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));
    return p.year+"-"+p.month+"-"+p.day;
  }
  function dubaiDate(){
    return new Intl.DateTimeFormat("en-GB",{timeZone:TIMEZONE,weekday:"long",day:"numeric",month:"long"}).format(new Date());
  }
  function daypart(){
    const hour=Number(new Intl.DateTimeFormat("en-GB",{timeZone:TIMEZONE,hour:"2-digit",hourCycle:"h23"}).format(new Date()));
    return hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
  }
  function nextDay(s,n){
    const [y,m,d]=s.split("-").map(Number);
    const a=new Date(Date.UTC(y,m-1,d+n,12));
    return [a.getUTCFullYear(),String(a.getUTCMonth()+1).padStart(2,"0"),String(a.getUTCDate()).padStart(2,"0")].join("-");
  }
  function labelDate(s){
    if(!s)return "No due date";
    const [y,m,d]=s.split("-").map(Number);
    if(!y||!m||!d)return "No due date";

  }
  function priorities(){return {Urgent:0,High:1,Medium:2,Normal:3,Low:4}}

    const data=all(),life=Array.isArray(data.life)?data.life:[],university=Array.isArray(data.university)?data.university:[];

      ...life.filter(x=>x&&x.title&&!x.archived&&x.kind!=="event").map(x=>({...x,section:"life",due:x.date||x.due||"",category:x.category||"Personal"})),
      ...university.filter(x=>x&&x.title&&!x.archived&&x.date).map(x=>({...x,section:"university",due:x.date||"",priority:x.priority||"Normal",category:"University"}))

  }

  function toSection(section){

    node.innerHTML='<div class="ahd-note-dialog"><div class="ahd-note-dialog-head"><h2 id="ahNoteHeading">New note</h2><button type="button" class="ahd-plain-btn" id="ahNoteClose" aria-label="Close note">×</button></div><form id="ahNoteForm"><label for="ahNoteTitle">Note title</label><input id="ahNoteTitle" maxlength="160" placeholder="An idea, plan or reminder" required><label for="ahNoteDate">Due date (optional)</label><input id="ahNoteDate" type="date"><label for="ahNoteBody">Details</label><textarea id="ahNoteBody" rows="7" placeholder="Write something you want to remember..."></textarea><div class="ahd-note-dialog-actions"><button type="button" class="ahd-plain-btn" id="ahNoteCancel">Cancel</button><button type="submit" class="ahd-solid-btn">Save note</button></div></form></div>';
    document.body.appendChild(node);

    document.getElementById("ahNoteForm").onsubmit=e=>{

  }
  function shortcutIcon(item){
    return `<button type="button" class="ahd-shortcut" data-route="${safe(item[0])}"><span class="ahd-shortcut-symbol" aria-hidden="true">${item[1]}</span><span>${safe(item[2])}</span><span class="ahd-chev">›</span></button>`;
  }
  function draw(){
    if(page!=="home")return;
    const today=todayDubai(),data=taskData(),open=data.filter(x=>!x.done),overdue=open.filter(x=>x.due&&x.due<today),due=open.filter(x=>x.due===today);
    const completed=data.filter(x=>x.done).length;
    const listed=taskList(today),shown=allTasks?listed:listed.slice(0,5);
    const rawNotes=notesRead(),displayNotes=rawNotes.filter(n=>!!n.archived===noteArchive).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
    const upcoming=calendarEvents();
    const root=document.getElementById("content");
    if(!root)return;
    root.innerHTML=`
      <div class="ahd">
      <section class="ahd-greeting"><div><div class="ahd-kicker">AHMED LIFE LAB · ${safe(dubaiDate())} · DUBAI</div>
        <h1>${daypart()}, Ahmed.</h1><p>Your day at a glance. Focus on what matters, then make something new.</p></div>
        <button type="button" id="ahdOpenCalendar" class="ahd-date-pill">📅 <span>Open calendar</span> ›</button>
      </section>
      <section class="ahd-stats" aria-label="Daily summary">
       <div><strong>${due.length}</strong><span>Due today</span></div>
       <div><strong>${overdue.length}</strong><span>Overdue</span></div>
       <div><strong>${open.length}</strong><span>Open tasks</span></div>
       <div><strong>${upcoming.length}</strong><span>Upcoming events</span></div>
      </section>
      <div class="ahd-layout">
       <div class="ahd-work">
         <div class="ahd-columns">
           <section class="ahd-panel ahd-tasks" aria-labelledby="ahdTasksTitle">
             <div class="ahd-panel-top"><div><div class="ahd-eyebrow">PLAN YOUR DAY</div><h2 id="ahdTasksTitle">Tasks / To do</h2></div><button type="button" class="ahd-solid-btn ahd-add-task" id="ahdAddTask">+ Task</button></div>
             <div class="ahd-panel-controls">
               <label for="ahdSort">Sort</label><select id="ahdSort"><option value="priority" ${ordering==="priority"?"selected":""}>Priority</option><option value="due" ${ordering==="due"?"selected":""}>Due date</option></select>
               <button type="button" id="ahdCompleted" class="ahd-filter ${showCompleted?"on":""}">Completed · ${completed}</button>
             </div>
             <div class="ahd-task-list">${shown.length?shown.map(t=>taskCard(t,today)).join(""):`<div class="ahd-empty">${showCompleted?"No completed tasks yet.":"Nothing pending yet. Add your first task or university deadline."}</div>`}</div>
             ${listed.length>5?`<button type="button" id="ahdMoreTasks" class="ahd-more">${allTasks?"Show fewer":"Show all "+listed.length+" tasks"}</button>`:""}
           </section>
           <section class="ahd-panel ahd-notes" aria-labelledby="ahdNotesTitle">
             <div class="ahd-panel-top"><div><div class="ahd-eyebrow">CAPTURE YOUR IDEAS</div><h2 id="ahdNotesTitle">Notes</h2></div><button type="button" id="ahdAddNote" class="ahd-solid-btn ahd-note-add">+ Note</button></div>
             <div class="ahd-panel-controls"><span>${rawNotes.filter(n=>!n.archived).length} active notes</span><button type="button" class="ahd-filter ${noteArchive?"on":""}" id="ahdShowArchived">${noteArchive?"Active notes":"Archived"}</button></div>
             <div class="ahd-note-list">${displayNotes.length?displayNotes.slice(0,6).map(noteCard).join(""):`<div class="ahd-empty">${noteArchive?"No archived notes.":"Keep ideas, reading notes and things you want to build here."}</div>`}</div>
             ${displayNotes.length>6?`<p class="ahd-note-count">Showing 6 of ${displayNotes.length} notes</p>`:""}
           </section>
         </div>
         <section class="ahd-upcoming"><div class="ahd-upcoming-top"><h2>Coming up</h2><button type="button" id="ahdUpcomingLink" class="ahd-plain-btn">View calendar ›</button></div>
         <div class="ahd-event-list">${upcoming.length?upcoming.map(x=>`<button type="button" class="ahd-event-chip" data-event-open="life"><span class="ahd-event-date">${safe(labelDate(x.date))}</span><span>${safe(x.time?x.time+" · ":"")}${safe(x.title)}</span></button>`).join(""):"<span class='ahd-upcoming-empty'>No events over the next seven days.</span>"}</div></section>
       </div>
       
      </div>
      
      <div class="ahd-local-note">Your tasks and notes currently stay on this device. Shared cloud synchronization isn't connected yet.</div>
      </div>`;
    const banner=document.querySelector("main>.notice");if(banner)banner.hidden=true;
    root.querySelector("#ahdOpenCalendar").onclick=()=>toSection("life");
    root.querySelector("#ahdAddTask").onclick=launchCalendarTask;
    root.querySelector("#ahdSort").onchange=e=>{ordering=e.target.value;draw()};
    root.querySelector("#ahdCompleted").onclick=()=>{showCompleted=!showCompleted;allTasks=false;draw()};
    root.querySelector("#ahdAddNote").onclick=()=>noteModal(null);
    root.querySelector("#ahdShowArchived").onclick=()=>{noteArchive=!noteArchive;draw()};
    root.querySelector("#ahdUpcomingLink").onclick=()=>toSection("life");
    
    root.querySelectorAll("[data-event-open]").forEach(b=>b.onclick=()=>toSection("life"));
    root.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>toSection(b.dataset.route));
    root.querySelectorAll("[data-complete]").forEach(b=>b.onclick=()=>completeTask(b.dataset.source,b.dataset.complete,b.dataset.value==="true"));
    root.querySelectorAll("[data-edit-task]").forEach(b=>b.onclick=()=>{
      if(b.dataset.source==="university"){toSection("university");return}
      toSection("life");
      const item=document.querySelector('#content [data-openitem="'+b.dataset.editTask+'"]');
      if(item)item.click();
    });
    root.querySelectorAll("[data-edit-note]").forEach(b=>b.onclick=()=>noteModal(b.dataset.editNote));
    root.querySelectorAll("[data-note-archive]").forEach(b=>b.onclick=()=>archiveNote(b.dataset.noteArchive));
    root.querySelectorAll("[data-note-task]").forEach(b=>b.onclick=()=>makeTask(b.dataset.noteTask));
    const more=root.querySelector("#ahdMoreTasks");if(more)more.onclick=()=>{allTasks=!allTasks;draw()};
  }
  render=function(){
    oldRender();
    const warning=document.querySelector("main>.notice");
    if(warning)warning.hidden=page==="home"||page==="life";
    if(page==="home")draw();
  };
  render();
})();</script><script src="/writing-v2.js?v=20261019"></script>
